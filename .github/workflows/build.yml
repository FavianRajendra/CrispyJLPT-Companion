name: Build CrispyJLPT-Companion

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && 'Build Public Offline Android APK' || 'Build Personal Cloud Android APK' }}
    runs-on: ubuntu-latest
    # Inject Turso credentials ONLY on personal branch builds (never on public v* release tags)
    env:
      VITE_TURSO_DATABASE_URL: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.VITE_TURSO_DATABASE_URL || '' }}
      VITE_TURSO_AUTH_TOKEN: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.VITE_TURSO_AUTH_TOKEN || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & Configure SQLite C Linkers
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

          NDK_PATH="$SDK_ROOT/ndk/26.1.10909125"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "$SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Install Rust Toolchain & Android ARM64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Web Bundle & Enforce Offline Safety Gate
        run: |
          npm ci
          npm run build
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if grep -rn "turso\.io" dist/; then
              echo "SECURITY ERROR: Turso URL leaked into public release bundle!"
              exit 1
            fi
            echo "Verified: Public offline web bundle contains zero Turso credentials."
          fi

      - name: Initialize & Build Signed Android APK (ARM64)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          npx tauri android build --debug --apk --target aarch64

      - name: Upload Personal Cloud APK Artifact (Private Branch Only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: CrispyJLPT-Companion-Personal-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

      - name: Attach Offline APK to Public GitHub Release (On Version Tags v*)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  build-desktop:
    name: >-
      ${{ startsWith(github.ref, 'refs/tags/v') && format('Build Public Offline Desktop ({0})', matrix.platform) || format('Build Personal Cloud Desktop ({0})', matrix.platform) }}
    runs-on: ${{ matrix.os }}
    # Inject Turso credentials ONLY on personal branch builds (never on public v* release tags)
    env:
      VITE_TURSO_DATABASE_URL: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.VITE_TURSO_DATABASE_URL || '' }}
      VITE_TURSO_AUTH_TOKEN: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.VITE_TURSO_AUTH_TOKEN || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm ci

      - name: Build Personal Desktop App (Private Artifacts on Push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}

      - name: Upload Personal Desktop Installers as Artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: CrispyJLPT-Companion-Personal-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

      - name: Build & Publish Public Offline Desktop Release (On Version Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CrispyJLPT-Companion ${{ github.ref_name }} (Offline Edition)'
          releaseBody: 'Offline-first cross-platform release for macOS, Windows, and Android. All progress and kanji notes are stored locally on your device.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos' && '--target universal-apple-darwin' || '' }}